name: Apply Patches with Fuzzy Matching

on:
  push:
    branches:
      - 16.0-test
    paths:
      - 'patches/**'
      - '.github/workflows/apply-patches-and-test.yml'
  pull_request:
    branches:
      - 16.0-test
  workflow_dispatch:

jobs:
  apply-patches-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 16.0-test

      - name: List patches
        run: |
          echo "=== Patches to apply ==="
          ls -lah patches/
          echo ""
          echo "=== Patch contents preview ==="
          for patch in patches/*.patch; do
            echo "File: $patch"
            head -20 "$patch"
            echo "---"
          done

      - name: Apply patches with fuzzy matching
        run: |
          set -e
          echo "=== Applying patches with fuzzy matching ==="
          for patch in patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying: $patch"
              
              # Try strict patch first
              if git apply --check "$patch" 2>/dev/null; then
                echo "✓ Strict patch check passed"
                git apply "$patch"
                echo "✓ Applied: $patch (strict mode)"
              else
                echo "⚠ Strict patch failed, trying fuzzy matching..."
                
                # Try with fuzz factor, use -f to skip prompts
                if patch -p1 --dry-run -f <"$patch" 2>/dev/null; then
                  patch -p1 -f <"$patch" || {
                    # If patch fails (e.g., already applied), check if changes are present
                    if grep -q "ANDROID_KABI_USE" include/linux/sched/user.h 2>/dev/null || \
                       grep -q "ANDROID_KABI_USE" include/linux/sched.h 2>/dev/null; then
                      echo "⚠ Patch appears to be already applied (changes detected), continuing..."
                    else
                      echo "ERROR: Could not apply patch $patch"
                      exit 1
                    fi
                  }
                  echo "✓ Applied: $patch (fuzzy mode)"
                else
                  # Check if changes are already applied
                  if grep -q "ANDROID_KABI_USE" include/linux/sched/user.h 2>/dev/null || \
                     grep -q "ANDROID_KABI_USE" include/linux/sched.h 2>/dev/null; then
                    echo "⚠ Patch already applied (changes detected), skipping..."
                  else
                    echo "ERROR: Could not apply patch $patch with any method"
                    echo "Showing patch context:"
                    head -50 "$patch"
                    exit 1
                  fi
                fi
              fi
            fi
          done
          echo ""
          echo "=== All patches processed successfully ==="

      - name: Check patch results
        run: |
          echo "=== Modified files ==="
          git diff --name-only
          echo ""
          echo "=== Diff summary ==="
          git diff --stat
          echo ""
          echo "=== Full diff preview (first 150 lines) ==="
          git diff | head -150

      - name: Verify patches were applied
        run: |
          echo "=== Checking applied patches ==="
          echo ""
          echo "1. SYSVIPC patch check:"
          if grep -q "ANDROID_KABI_USE(6, struct sysv_sem" include/linux/sched.h; then
            echo "✓ SYSVIPC patch applied (found ANDROID_KABI_USE for sysv_sem)"
            grep -A 3 "CONFIG_SYSVIPC" include/linux/sched.h | tail -5
          else
            echo "⚠ SYSVIPC patch - checking status..."
            grep -A 5 "struct nameidata" include/linux/sched.h | head -10
          fi
          
          echo ""
          echo "2. POSIX_MQUEUE patch check:"
          if grep -q "ANDROID_KABI_USE(1, unsigned long mq_bytes)" include/linux/sched/user.h; then
            echo "✓ POSIX_MQUEUE patch applied (found ANDROID_KABI_USE for mq_bytes)"
            grep -B 2 -A 4 "ANDROID_KABI_USE(1" include/linux/sched/user.h
          else
            echo "⚠ POSIX_MQUEUE patch status:"
            grep -A 8 "struct ratelimit_state" include/linux/sched/user.h | tail -10
          fi

      - name: Verify kernel configuration
        run: |
          echo "=== Checking kernel build files ==="
          ls -lah Makefile Kbuild Kconfig build.config.* 2>/dev/null || true
          echo ""
          echo "=== Kernel version info ==="
          head -5 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL" || echo "Version info not in standard Makefile location"

      - name: Create summary
        if: always()
        run: |
          echo "## Patch Application Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Patches Processed" >> $GITHUB_STEP_SUMMARY
          ls -1 patches/*.patch | while read patch; do
            echo "- $(basename $patch)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Source Files Modified" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --name-only || echo "No new changes in working tree"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Statistics" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --stat || echo "No stats available"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification Status" >> $GITHUB_STEP_SUMMARY
          if grep -q "ANDROID_KABI_USE" include/linux/sched.h; then
            echo "✓ SYSVIPC ABI padding applied" >> $GITHUB_STEP_SUMMARY
          fi
          if grep -q "ANDROID_KABI_USE(1, unsigned long mq_bytes)" include/linux/sched/user.h; then
            echo "✓ POSIX_MQUEUE ABI padding applied" >> $GITHUB_STEP_SUMMARY
          fi
