name: Build Kernel Image

on:
  push:
    branches:
      - 16.0-test
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'include/**'
      - 'kernel/**'
      - 'Makefile'
      - 'Kconfig'
      - 'build.config*'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    branches:
      - 16.0-test
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration to use'
        required: true
        default: 'build.config.msm.lahaina'
        type: choice
        options:
          - build.config.msm.lahaina
          - build.config.gki.aarch64
          - build.config.allmodconfig.aarch64

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  CC: clang
  LLVM: 1

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 16.0-test

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            curl \
            wget \
            git \
            cpio \
            kmod \
            python3
          
          echo "=== Build tools versions ==="
          clang --version
          aarch64-linux-gnu-gcc --version
          make --version

      - name: Determine build config
        id: config
        run: |
          if [ "${{ github.event.inputs.build_config }}" != "" ]; then
            CONFIG="${{ github.event.inputs.build_config }}"
          else
            CONFIG="build.config.msm.lahaina"
          fi
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "Using build config: $CONFIG"

      - name: Verify build config exists
        run: |
          if [ ! -f "${{ steps.config.outputs.config }}" ]; then
            echo "ERROR: Build config ${{ steps.config.outputs.config }} not found"
            ls -lah build.config*
            exit 1
          fi
          echo "✓ Build config found"
          cat "${{ steps.config.outputs.config }}"

      - name: Show kernel version
        run: |
          echo "=== Kernel Version ==="
          head -5 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL"
          KERNELVERSION=$(make kernelversion)
          echo "Kernel version: $KERNELVERSION"

      - name: Generate .config
        run: |
          echo "=== Generating .config ==="
          make -f ${{ steps.config.outputs.config }} clean 2>/dev/null || true
          make defconfig
          echo "✓ .config generated"
          ls -lah .config

      - name: Build kernel
        run: |
          echo "=== Starting Kernel Build ==="
          echo "Architecture: $ARCH"
          echo "Cross compile: $CROSS_COMPILE"
          echo "Compiler: $CC"
          
          # Set build parameters
          export KBUILD_VERBOSE=1
          export KCFLAGS="-Wno-error"
          
          # Attempt build
          make -j$(nproc) Image.gz 2>&1 | tee build.log
          
          # Check if build succeeded
          if [ $? -eq 0 ]; then
            echo "✓ Kernel build completed successfully"
          else
            echo "⚠ Build completed with warnings/errors"
            tail -50 build.log
          fi

      - name: Check build artifacts
        run: |
          echo "=== Build Artifacts ==="
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "✓ Image.gz found"
            ls -lah arch/arm64/boot/Image.gz
            file arch/arm64/boot/Image.gz
          else
            echo "⚠ Image.gz not found at expected location"
            echo "Searching for kernel image files..."
            find . -name "Image*" -o -name "vmlinuz*" -o -name "bzImage*" 2>/dev/null | head -20
          fi
          
          echo ""
          echo "=== Boot directory contents ==="
          ls -lah arch/arm64/boot/

      - name: Extract kernel info
        if: success()
        run: |
          echo "=== Kernel Image Information ==="
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            SIZE=$(stat -f%z "arch/arm64/boot/Image.gz" 2>/dev/null || stat -c%s "arch/arm64/boot/Image.gz")
            echo "Image size: $SIZE bytes ($(echo "scale=2; $SIZE / 1024 / 1024" | bc) MB)"
            
            # Try to extract kernel version from image
            echo "✓ Kernel image built successfully"
          fi

      - name: Prepare artifacts
        if: success()
        run: |
          echo "=== Preparing Artifacts ==="
          mkdir -p kernel-build-output
          
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            cp arch/arm64/boot/Image.gz kernel-build-output/
            echo "✓ Copied Image.gz"
          fi
          
          if [ -f "arch/arm64/boot/Image" ]; then
            cp arch/arm64/boot/Image kernel-build-output/
            echo "✓ Copied Image"
          fi
          
          if [ -f ".config" ]; then
            cp .config kernel-build-output/config-${{ steps.config.outputs.config }}
            echo "✓ Copied .config"
          fi
          
          if [ -f "build.log" ]; then
            cp build.log kernel-build-output/
            echo "✓ Copied build log"
          fi
          
          # Create info file
          cat > kernel-build-output/BUILD_INFO.txt << 'EOF'
          Build Information
          ==================
          Repository: amaturenoob/android_kernel_oneplus_sm8350
          Branch: 16.0-test
          Device: OnePlus SM8350 (Lahaina)
          Architecture: ARM64
          
          Build timestamp: $(date)
          EOF
          
          echo "✓ Artifacts prepared"
          ls -lah kernel-build-output/

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-sm8350
          path: kernel-build-output/
          retention-days: 30
          compression-level: 6

      - name: Create build summary
        if: always()
        run: |
          echo "## Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Config**: ${{ steps.config.outputs.config }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Device**: OnePlus SM8350 (Lahaina)" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: ARM64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            SIZE=$(stat -c%s "arch/arm64/boot/Image.gz" 2>/dev/null || echo "unknown")
            echo "### Build Result: ✅ SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "- **Image.gz size**: $SIZE bytes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Artifacts Available" >> $GITHUB_STEP_SUMMARY
            echo "- `Image.gz` - Compressed kernel image" >> $GITHUB_STEP_SUMMARY
            echo "- `Image` - Uncompressed kernel image (if available)" >> $GITHUB_STEP_SUMMARY
            echo "- `config-*` - Kernel configuration file" >> $GITHUB_STEP_SUMMARY
            echo "- `build.log` - Full build log" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Build Result: ⚠️ INCOMPLETE" >> $GITHUB_STEP_SUMMARY
            echo "Image.gz not found. Check build log for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifacts from the Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract `Image.gz` to your device" >> $GITHUB_STEP_SUMMARY
          echo "3. Flash to your OnePlus SM8350 device" >> $GITHUB_STEP_SUMMARY
